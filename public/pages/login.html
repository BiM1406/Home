<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Đăng Nhập &amp; Đăng Ký — RoomRent Thượng Lưu</title>

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/slideshow.css">
  <link rel="stylesheet" href="../css/responsive.css">

  <style>
    .auth-card { background: #ffffff; border: 1px solid var(--border-color); border-radius: 24px; padding: 40px; max-width: 460px; margin: 56px auto 72px; box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.15); }
    .auth-tabs { display: flex; border-bottom: 2px solid #e2e8f0; margin-bottom: 28px; }
    .auth-tab { flex: 1; text-align: center; padding: 12px; font-weight: 700; font-size: 0.95rem; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .auth-tab.active { color: var(--primary-600); border-bottom-color: var(--primary-600); }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    
    .form-group-mb14 { margin-bottom: 14px; }
    .form-group-mb16 { margin-bottom: 16px; }
    .form-group-mb20 { margin-bottom: 20px; }
    .form-label-bold { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; }
    .btn-auth-submit { width: 100%; padding: 12px; margin-bottom: 16px; }
    .btn-reg-submit { width: 100%; padding: 12px; background: var(--gold-gradient); color: #78350f; }
    .opacity-divider { opacity: 0.4; }
    .header-icon-20 { width: 20px; height: 20px; }
    .svg-sprite-hidden { display: none; }
  </style>
</head>

<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="svg-sprite-hidden" aria-hidden="true">
    <symbol id="icon-sparkle" viewBox="0 0 24 24"><path d="m12 3 1.6 4.9L18.5 9.5 13.6 11 12 16l-1.6-5L5.5 9.5 10.4 7.9Z"/><path d="M18 16v4"/><path d="M16 18h4"/></symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></symbol>
  </svg>

  <!-- ============ Luxury Header ============ -->
  <header class="site-header">
    <div class="container header-container">
      <a href="index.html" class="logo" aria-label="RoomRent - Trang chủ">
        <span class="logo-icon"><svg class="icon header-icon-20"><use href="#icon-sparkle"/></svg></span>
        Room<span class="logo-accent">Rent</span>
      </a>

      <nav aria-label="Điều hướng chính" class="main-nav">
        <ul class="nav-links" id="main-nav-links">
          <li><a class="nav-link" href="index.html">Trang chủ</a></li>
          <li><a class="nav-link" href="search.html">Tìm kiếm</a></li>
          <li><a class="nav-link" href="pricing.html">Gói &amp; Đẩy tin</a></li>
          <li><a class="nav-link" href="post-property.html">Đăng tin</a></li>

          <!-- Mobile Only Actions inside Navigation Drawer -->
          <li class="mobile-drawer-footer">
            <div class="mobile-drawer-lang-wrap">
              <div class="lang-currency-selector mobile-lang-select-group" role="group" aria-label="Ngôn ngữ và tiền tệ">
                <select id="mobile-lang-select" aria-label="Ngôn ngữ trên di động">
                  <option value="vi" selected>Tiếng Việt (VI)</option>
                  <option value="en">English (EN)</option>
                </select>
                <span class="opacity-divider">|</span>
                <select id="mobile-currency-select" aria-label="Tiền tệ trên di động">
                  <option value="VND" selected>VND (₫)</option>
                  <option value="USD">USD ($)</option>
                </select>
              </div>
            </div>
            <div class="mobile-drawer-cta-group">
              <a href="login.html" class="btn-header-login mobile-cta-login">Đăng nhập</a>
              <a href="login.html?tab=register" class="btn-header-register mobile-cta-register">Đăng ký tài khoản</a>
            </div>
          </li>
        </ul>
      </nav>

      <div class="header-actions">
        <div class="lang-currency-selector desktop-only-action" role="group" aria-label="Ngôn ngữ và tiền tệ">
          <select id="lang-select" aria-label="Ngôn ngữ">
            <option value="vi" selected>VI</option>
            <option value="en">EN</option>
          </select>
          <span class="opacity-divider">|</span>
          <select id="currency-select" aria-label="Tiền tệ">
            <option value="VND" selected>VND</option>
            <option value="USD">USD</option>
          </select>
        </div>
        <a href="login.html" class="btn-header-login desktop-only-action">Đăng nhập</a>
        <a href="login.html?tab=register" class="btn-header-register desktop-only-action">Đăng ký</a>
        <button class="mobile-menu-toggle" id="mobile-menu-toggle-btn" type="button" aria-label="Mở menu" aria-expanded="false" aria-controls="main-nav-links">
          <svg class="icon header-icon-24"><use href="#icon-menu"/></svg>
        </button>
      </div>
    </div>
  </header>
  <div class="mobile-menu-backdrop" id="mobile-menu-backdrop" aria-hidden="true"></div>

  <main id="main-content" class="container">
    <div class="auth-card">
      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-login-btn">Đăng Nhập</div>
        <div class="auth-tab" id="tab-register-btn">Đăng Ký</div>
      </div>

      <form id="form-login" class="auth-form active">
        <div class="form-group-mb16">
          <label for="login-email" class="form-label-bold">Email hoặc Số điện thoại</label>
          <input type="email" id="login-email" required class="hero-search-input" value="landlord@roomrent.vn" placeholder="nhap@email.com">
        </div>
        <div class="form-group-mb20">
          <label for="login-pass" class="form-label-bold">Mật khẩu</label>
          <input type="password" id="login-pass" required class="hero-search-input" value="123456" placeholder="Nhập mật khẩu">
        </div>
        <button type="submit" class="btn-hero-search btn-auth-submit">ĐĂNG NHẬP NGAY</button>
      </form>

      <form id="form-register" class="auth-form">
        <div class="form-group-mb14">
          <label for="reg-name" class="form-label-bold">Họ và Tên</label>
          <input type="text" id="reg-name" required class="hero-search-input" placeholder="Nguyễn Văn A">
        </div>
        <div class="form-group-mb14">
          <label for="reg-email" class="form-label-bold">Email</label>
          <input type="email" id="reg-email" required class="hero-search-input" placeholder="user@domain.com">
        </div>
        <div class="form-group-mb20">
          <label for="reg-pass" class="form-label-bold">Mật khẩu</label>
          <input type="password" id="reg-pass" required class="hero-search-input" placeholder="Nhập mật khẩu mới">
        </div>
        <button type="submit" class="btn-hero-search btn-reg-submit">TẠO TÀI KHOẢN MỚI</button>
      </form>
    </div>
  </main>

  <footer class="site-footer"><div class="container"><div class="footer-bottom"><p>© 2026 RoomRent Auth.</p></div></div></footer>

  <script src="../js/slideshow.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var tabLogin = document.getElementById('tab-login-btn');
      var tabRegister = document.getElementById('tab-register-btn');
      var formLogin = document.getElementById('form-login');
      var formRegister = document.getElementById('form-register');

      tabLogin.addEventListener('click', function () {
        tabLogin.classList.add('active'); tabRegister.classList.remove('active');
        formLogin.classList.add('active'); formRegister.classList.remove('active');
      });
      tabRegister.addEventListener('click', function () {
        tabRegister.classList.add('active'); tabLogin.classList.remove('active');
        formRegister.classList.add('active'); formLogin.classList.remove('active');
      });

      formLogin.addEventListener('submit', function (e) {
        e.preventDefault();
        alert('🎉 Đăng nhập thành công!');
        window.location.href = 'dashboard.html';
      });
      formRegister.addEventListener('submit', function (e) {
        e.preventDefault();
        alert('🎉 Đăng ký thành công!');
        window.location.href = 'dashboard.html';
      });
    });
  </script>
</body>
</html>
